services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: rte
      POSTGRES_PASSWORD: rte_dev_password
      POSTGRES_DB: rte
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rte -d rte"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test-db:
    profiles: ["test"]
    image: postgres:17
    environment:
      POSTGRES_USER: rte_test
      POSTGRES_PASSWORD: rte_test_password
      POSTGRES_DB: rte_test
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rte_test -d rte_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres_data:
