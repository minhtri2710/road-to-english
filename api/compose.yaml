# Local dev + test DB, disposable (pre-launch). One DB shared by `go run` and `go test`. On a schema change, recreate: `docker compose -f api/compose.yaml down -v`.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: rte
      POSTGRES_PASSWORD: rte_dev_password
      POSTGRES_DB: rte
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rte -d rte"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
